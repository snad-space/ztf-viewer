[build-system]
# >=68.1: [tool.setuptools] pyproject.toml config (packages.find, package-data) promoted out of beta
requires = ["setuptools>=68.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ztf_viewer"
version = "2026.8.0"
authors = [
  {email = "hombit@gmail.com"},
  {name = "Konstantin Malanchev"}
]
description = "ZTF data releases viewer"
readme = "README.md"
license = {text = "MIT"}
keywords = ["science", "astrophysics"]
requires-python = ">=3.14"
dependencies = [
    "dash[async,fastapi]>=4.4.1,<5.0",
    "uvicorn[standard]",
    "dash_defer_js_import",
    "ipywidgets>=7.0.0", # needed by plotly
    "orjson",
    "pandas",
    "pydantic",
    "numpy",
    "astropy",
    "astroquery",
    "httpx",
    "jinja2",
    "markupsafe",
    "requests",
    "redis",
    "matplotlib>=3.3",
    "cachetools",
    "scipy",
    # v4 brake our immutabledefaultdict implementation
    "immutabledict<4",
    "alerce",
    "antares-client>=1.2.0",
    "plotly[express]",
    # required by plotly
    "anywidget",
    "mocpy",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
]

[project.urls]
homepage = "ztf.snad.space"
repository = "github.com/snad-space/ztf_viewer"
changelog = "github.com/snad-space/ztf_viewer/blob/master/CHANGELOG.md"

[tool.uv]
# antares-client depends on the abandoned "bson" package (0.5.10, 2021), which is
# sdist-only and whose setup.py calls pkgutil.find_loader(), removed in Python
# 3.14, so it cannot be built at all. It is only used by antares_client.stream,
# which we never import - antares_client guards that import with try/ImportError,
# exactly as it does for the optional confluent_kafka. A marker that is never true
# drops the dependency.
override-dependencies = ["bson; sys_platform == 'never'"]
environments = [
    # Production
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    # Development
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.setuptools.packages.find]
exclude = ["tests"]

[tool.setuptools.package-data]
ztf_viewer = [
    "catalogs/snad/data/snad_catalog.csv",
    "assets/*",
    "static/img/*",
    "static/js/*",
    "static/js9/*",
]

[tool.pytest.ini_options]
minversion = "6.0"
# -p pytester: bundled, off by default; tests/test_async_support.py runs pytest inside pytest.
addopts = "-ra -q -p pytester"
testpaths = [
    "tests",
]
# "auto": an `async def test_` needs no per-test marker.
asyncio_mode = "auto"
# Explicit because the default is deprecated; a fresh loop per test also matches Flask's
# per-request loop (plan 001, F1c), so a leaked loop-affine resource fails here.
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 120
target-version = ["py314"]
include = '\.py$'

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Rules newly enabled by default in ruff 0.16.x that we are not yet ready to enforce
extend-ignore = [
    "B008",    # function-call-in-default-argument
    "BLE001",  # blind-except
    "C400",    # unnecessary-generator-list
    "C401",    # unnecessary-generator-set
    "C408",    # unnecessary-collection-call
    "DTZ001",  # call-datetime-without-tzinfo
    "DTZ005",  # call-datetime-now-without-tzinfo
    "EXE001",  # shebang-not-executable
    "EXE002",  # shebang-missing-executable-file
    "FURB162", # fromisoformat-replace-z
    "LOG015",  # root-logger-call
    "PLW1510", # subprocess-run-without-check
    "PYI025",  # unaliased-collections-abc-set-import
    "RUF012",  # mutable-class-default
    "RUF024",  # mutable-fromkeys-value
    "RUF059",  # unpacked-unused-variable
    "SIM101",  # duplicate-isinstance-call
    "SIM102",  # collapsible-if
    "SIM117",  # multiple-with-statements
    "TRY004",  # type-check-without-type-error
    "UP046",   # non-pep695-generic-class
]

[tool.ruff.lint.per-file-ignores]
# F401: imported but unused
"ztf_viewer/catalogs/__init__.py" = ["F401"]
"ztf_viewer/catalogs/extinction/__init__.py" = ["F401"]
"ztf_viewer/catalogs/snad/__init__.py" = ["F401"]
"ztf_viewer/importer.py" = ["F401"]
"ztf_viewer/lc_data/__init__.py" = ["F401"]

[dependency-groups]
tests = [
    # Used by the ASGI test client and by conftest's network-error classifier.
    "httpx",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "pytest-redis>=4.0.0",
]
