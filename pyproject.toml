[build-system]
# >=68.1: [tool.setuptools] pyproject.toml config (packages.find, package-data) promoted out of beta
requires = ["setuptools>=68.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ztf_viewer"
version = "2026.6.0"
authors = [
  {email = "hombit@gmail.com"},
  {name = "Konstantin Malanchev"}
]
description = "ZTF data releases viewer"
readme = "README.md"
license = {text = "MIT"}
keywords = ["science", "astrophysics"]
requires-python = ">=3.12"
dependencies = [
    "dash>=4.4.1,<5.0",
    "dash_defer_js_import",
    "ipywidgets>=7.0.0", # needed by plotly
    "orjson",
    "flask",
    "pandas",
    "pydantic",
    "numpy",
    "astropy",
    "astroquery",
    "jinja2",
    "markupsafe",
    "requests",
    "redis",
    "redis-lru",
    "matplotlib>=3.3",
    "cachetools",
    "scipy",
    # v4 brake our immutabledefaultdict implementation
    "immutabledict<4",
    "alerce",
    # supports astropy 5
    "dustmaps>=1.0.10",
    "antares-client>=1.2.0",
    "plotly[express]",
    # required by plotly
    "anywidget",
    "mocpy",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
]

[project.urls]
homepage = "ztf.snad.space"
repository = "github.com/snad-space/ztf_viewer"
changelog = "github.com/snad-space/ztf_viewer/blob/master/CHANGELOG.md"

[tool.uv]
environments = [
    # Production
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    # Development
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.setuptools.packages.find]
exclude = ["tests"]

[tool.setuptools.package-data]
ztf_viewer = [
    "catalogs/snad/data/snad_catalog.csv",
    "assets/*",
    "static/img/*",
    "static/js/*",
    "static/js9/*",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.black]
line-length = 120
target-version = ["py312"]
include = '\.py$'

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.per-file-ignores]
# F401: imported but unused
"ztf_viewer/catalogs/__init__.py" = ["F401"]
"ztf_viewer/catalogs/extinction/__init__.py" = ["F401"]
"ztf_viewer/catalogs/snad/__init__.py" = ["F401"]
"ztf_viewer/importer.py" = ["F401"]
"ztf_viewer/lc_data/__init__.py" = ["F401"]

[dependency-groups]
deploy = [
    "gunicorn>=26.0.0",
]
tests = [
    "pytest>=9.1.1",
    "pytest-redis>=4.0.0",
]
